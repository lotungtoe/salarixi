name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # kernel uses #![feature(ip_as_octets)] -> nightly required
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - run: curl -L --retry 5 -o wix314.zip "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" && mkdir -p wix && powershell -Command "Expand-Archive -Path wix314.zip -DestinationPath wix"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "salarixi-vi v__VERSION__"
          releaseBody: "salarixi 1.3.1 với giao diện tiếng Việt. Cài bằng NSIS installer hoặc chạy exe."
          releaseDraft: false
          prerelease: false