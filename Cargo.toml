[workspace]
members = [
	"app",
  "kernel",
	"extensions",
	"macros"
]
resolver = "3"

[workspace.package]
version = "1.3.0"
repository = "https://codeberg.org/nullclyze/salarixi"
authors = ["nullclyze"]
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = "z"
strip = true
codegen-units = 1
lto = "fat"

[workspace.dependencies]
salarixi-kernel = { path = "kernel" }
salarixi-extensions = { path = "extensions" }
salarixi-macros = { path = "macros" }
tauri = { version = "2.11.0", features = [] }
tokio = { version = "1.50.0", features = ["full"] }
azalea = { version = "0.16.0", default-features = false, features = ["packet-event"] }
socks5-impl = { version = "0.8.0", features = ["client"] }
reqwest = { version = "0.13.1", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["rayon", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
syn = { version = "2.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
memory-stats = "1.0.0"
open = "5.3.3"
tauri-plugin-dialog = "2.7.1"
discord-presence = "3.2.0"
systemstat = "0.2.7"
rand = "0.8"
aes-gcm = "0.10"
regex = "1"
base64 = "0.22.1"
dashmap = "6.1.0"
md-5 = "0.11.0"
rhai = "1.24.0"
dns-lookup = "3.0.1"
hashbrown = "0.16.1"
bytes = "1.12.1"
pkcs8 = "=0.11.0-rc.11"
proc-macro2 = "1.0.107"
quote = "1.0"
zip = "0.6.4"
